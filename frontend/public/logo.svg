<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="520" height="128">
  <!-- Logo mark background -->
  <rect x="0" y="8" width="48" height="48" rx="10" fill="#3a5c42"/>

  <!-- Icon: 4 squares / grid with plus -->
  <rect x="9"  y="17" width="12" height="12" rx="1.5" fill="none" stroke="white" stroke-width="1.8"/>
  <rect x="27" y="17" width="12" height="12" rx="1.5" fill="none" stroke="white" stroke-width="1.8"/>
  <rect x="9"  y="35" width="12" height="12" rx="1.5" fill="none" stroke="white" stroke-width="1.8"/>
  <!-- Plus in bottom-right quadrant -->
  <line x1="27" y1="41" x2="39" y2="41" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="33" y1="35" x2="33" y2="47" stroke="white" stroke-width="1.8" stroke-linecap="round"/>

  <!-- "Porezni" text -->
  <text x="64" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#1a1a1a" letter-spacing="-0.3">Porezni</text>

  <!-- "Kalkulator" text in sage green -->
  <text x="64" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#3a5c42" letter-spacing="-0.3">Kalkulator</text>
</svg>
